name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pyelftools rsync swig unzip zlib1g-dev libelf-dev texinfo

      - name: Build firmware
        run: |
          chmod +x build.sh
          JOBS="$(nproc)" ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melonpi-m21-firmware
          if-no-files-found: error
          path: |
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/*melonpi-m21*squashfs-sysupgrade.bin
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/*melonpi-m21.manifest
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/sha256sums

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/*melonpi-m21*squashfs-sysupgrade.bin
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/*melonpi-m21.manifest
            /home/runner/melonpi-m21-build/immortalwrt/bin/targets/ramips/mt7621/sha256sums
          generate_release_notes: true

# 说明：GitHub 托管 runner 磁盘约 14 GB，完整 OpenWrt 构建可能接近上限；
# 上面已清理部分预装工具。如仍空间不足，可改用自托管 runner 或缩减包集。
